version: '3.8'

services:
  quantum-weave-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantum_weave_ai_platform
    ports:
      - "5000:5000"
    volumes:
      # Persist SQLite/JSON database and RAG indices
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-quantum_weave_secret_verify_2026}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-104829102948192}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    restart: unless-stopped
